# lambda-Reachability PPO fallback for the 65 C thermal comparison (the user, 2026-11-22: arm 3 =
# BeyondMimic + lambda-Reach; "don't give lambda reachability temperature observation"; its
# safety rule is falls only). The world of Beat-It v6 (configs/g1_recover_sonic_thermal70_v6_
# hybrid_safetyshac1p.yaml: sysID v0.6 body, the v6 SONIC handover bank, DR, fall terminations,
# 3 s episodes, rest truncation) WITHOUT temperatures: task g1_recover_noheight_v6 (actor 98-D,
# critic 113-D, margin g_fall_noheight). Recipe = the lambda-Reach runs of the main checkout
# (configs/g1_recover_sonic_lambdareach1p.yaml = SafetyPPO1P's recipe + the lambda-Reach target).
#
#   PYTHONPATH=$HOME/safety-stable-baselines-baselines python examples/train.py \
#       --config configs/g1_recover_noheight_v6_lambdareach1p.yaml --seed 0 \
#       --out runs/thermal65/lambdareach_s0
#
family: on_policy
task: g1_recover_noheight_v6
num_envs: 4096
steps: 1500000000
seed: 0

env_overrides:
  dataset: data/g1_sonic_push_gfall_sysid316v6_train_bank_net.pt
  weights: {handover: 1.0, nominal: 0.0, clean: 0.0, pushed: 0.0, fell: 0.0,
            synthetic: 0.0, mocap: 0.0}
  sampler: uniform
  episode_length_s: 3.0
  rest_terminate: true
  rest_dwell_s: 0.4
  rest_arm_s: 0.8

privileged_critic: true
gamma: 0.99
gamma_anneal: false
net: "512,256,128"
action_rate_coef: 0.05
action_mag_coef: 0.005

value_estimator: lambda_reach
reach_lambda: 0.99
reach_n_max: 200
reach_target: expected
reach_tail: renormalize

lr: 1.0e-4
adaptive_lr: false
target_kl: 0.01
ent_coef: 1.0e-3
max_std: 0.4
critic_warmup_steps: 0

checkpoint_every: 50000000
video_interval: 100000000
video_seconds: 20
video_fps: 50
video_wandb: false
