# COOLING POLICY, round 2 (the user, 2026-11-18): g1_cool_thermal70_mix = the pilot's task
# with 30 % LAFAN train mocap spawns, handover rows kicked <= 1 m/s, pushes 0.19-0.97 m/s
# (the spawn banks are the env cfg's defaults, envs/g1_cool/env_cfg.py COOL_MIX_BANKS).
#
#   python examples/train.py --config configs/g1_cool_thermal70_mix_ppo.yaml --seed 0 \
#       --out runs/g1_cool/mix_s0
#
# mode=cumulative -> stock SB3 PPO on the numpy bridge (the scripted in-episode pushes
# rule out the SHAC world model). Reward weights live in envs/g1_cool/env_cfg.py
# (REWARDS); override one with env_overrides: {reward_weights: {cool: 3.0}}.
family: on_policy
task: g1_cool_thermal70_mix
num_envs: 4096
steps: 600000000
seed: 0
lr: 3.0e-4
ent_coef: 5.0e-3
n_steps: 24
gamma: 0.99
net: "512,256,128"
video_interval: 0        # no render env (EGL is not available on every GPU node)
