# BEAT-IT WITH A HYBRID WORLD MODEL ON SYSID v0.6 (the user, 2026-11-21: "train the heat aware
# safety filter (BeatIt with hybrid model) ... use the more accurate heat model").
#
#   PYTHONPATH=$HOME/ssb-wt-hybrid python examples/train.py \
#       --config configs/g1_recover_sonic_thermal70_v6_hybrid_safetyshac1p.yaml \
#       --seed 0 --out runs/shac_thermal70_v6/hybrid_s0
#   (the whole experiment: configs/sweeps/shac_thermal70_v6/)
#
# Needs safety_sb3 from the worktree ~/ssb-wt-hybrid (branch feat/shac-hybrid-thermal: the
# world model's analytic block; PYTHONPATH shadows the editable install) and the sysID repo
# v0.6.0 (4259dc6) at $G1_SYSID_DIR (pinned in envs/assets/g1_sysid.py).
#
# configs/g1_recover_sonic_thermal70_safetyshac1p.yaml (the 70 C margin arm), verbatim, except:
#   * task g1_recover_thermal70_v6: sysID v0.6 -- the identified body (limb masses / COMs,
#     joint friction measured in motion, ankle corner stops, foot contact, 37.40 kg) and the
#     heat model WITHOUT sim_heat_scale (removed upstream); the structure temperatures join the
#     critic group (200-D = the world-model state); actor obs unchanged (127-D);
#   * the start bank re-harvested on that robot (configs/sweeps/shac_thermal70_v6/data_jobs.txt);
#   * wm_hybrid: the world model's network predicts the body only and never reads the 87
#     temperature dims; the sysID heat model writes them every imagined step from the drive's
#     torque (filters/hybrid_thermal_model.py); the learned head learns the FALL margin and
#     termination; imagination mins in the analytic (70 C - hottest winding) / 10 C margin and
#     ends at a 70 C winding (the user's decisions, 2026-11-21).
#
family: model_based      # SHAC family -- the train.py router reads this
task: g1_recover_thermal70_v6
num_envs: 4096
steps: 1500000000
seed: 0
wm_hybrid: true   # the analytic heat block (see header)

# --- SHARED with the PPO arm (verbatim) ----------------------------------------
env_overrides:
  dataset: data/g1_sonic_push_gfall_sysid316v6_train_bank_net.pt
  weights: {handover: 1.0, nominal: 0.0, clean: 0.0, pushed: 0.0, fell: 0.0,
            synthetic: 0.0, mocap: 0.0}
  sampler: uniform       # handover rows drawn uniformly; no level curriculum
  episode_length_s: 3.0
  rest_terminate: true
  rest_dwell_s: 0.4
  rest_arm_s: 0.8

privileged_critic: true  # the world-model state AND the critic's input
gamma: 0.99
gamma_anneal: false
net: "512,256,128"
action_rate_coef: 0.05   # value units here (see the PPO arm's header)
action_mag_coef: 0.005

# --- SHAC recipe (SuperMimic's values unless noted) ---------------------------
lr: 2.0e-4
lr_decay_iters: 146500   # = the run's iterations: 1.5B / (4096 x 2.5)
lr_min_frac: 0.03
wm_warmup_iters: 1000    # ~10M env steps of model-only fitting first (the model
                         # reached its plateau error by ~350 iterations on G1)
actor_delay_iters: 200   # ~2M more: the critic's first fit before the actor moves
horizon: 32
imagine_batch: 4096
action_noise_std: 0.1
softmin_tau: 0.0
wm_net: "1024,1024,1024" # paper 3x2048; 16 GB shared with mjlab
wm_head_net: "256,256"
wm_window: 8
wm_batch: 2048
wm_gradient_steps: 10
critic_epochs: 5
critic_minibatches: 4
utd_ratio: 0.4
learning_starts: 64
replay_size: 500         # paper 1000 per env; ~1.1 GiB at 4096 envs (113-D); ~1.6 GiB at 171-D
tf32: true               # the paper's precision; 1.18x faster here

log_interval: 50
checkpoint_every: 50000000
video_interval: 100000000
video_seconds: 20
video_fps: 50
video_wandb: false
