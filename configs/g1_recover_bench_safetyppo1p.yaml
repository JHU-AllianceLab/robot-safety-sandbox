# The SafePPO arm of the SONIC push benchmark rebuilt in mjlab (task g1_recover_bench,
# envs/g1_recover/push_bench.py): the world of the friend's S7 benchmark --
# K as margin (joint term over 0.2 rad) and termination, 2 ms x 10 physics,
# SONIC's hip-pitch motor, foot friction 1, no domain randomization, the 70-D
# exact actor observation (his connector's phi68 + foot contacts).
#
#   python examples/train.py --config configs/g1_recover_bench_safetyppo1p.yaml \
#       --seed 0 --out runs/push_bench/ppo_s0
#   (the whole experiment: configs/sweeps/push_bench/README.md)
#
# Identical to configs/g1_recover_sonic_safetyppo1p.yaml (the recipe below is
# copied verbatim) but for the task and the start bank:
#   * data/g1_bench_push_train_bank_net.pt: SONIC tracking his three training
#     motions (walk1_subject1, run1_subject2, dance1_subject1 to 105 s) in this
#     world, his state pool's force push (12 bodies, a surface point, 5-15
#     ticks, dv 0.5-2.5 m/s), rows 0 / 0.1 / 0.2 / 0.3 s after the push ENDS
#     (no push inside an episode: SHAC's world model stays push-agnostic),
#     thinned to its eta = 0.1 net (configs/sweeps/push_bench/data_jobs.txt).
#
family: on_policy        # PPO family -- the train.py router reads this
task: g1_recover_bench
num_envs: 4096
steps: 1500000000
seed: 0

env_overrides:
  dataset: data/g1_bench_push_train_bank_net.pt
  weights: {handover: 1.0, nominal: 0.0, clean: 0.0, pushed: 0.0, fell: 0.0,
            synthetic: 0.0, mocap: 0.0}
  sampler: uniform       # handover rows drawn uniformly; no level curriculum
  episode_length_s: 3.0
  rest_terminate: true
  rest_dwell_s: 0.4
  rest_arm_s: 0.8

privileged_critic: true
gamma: 0.99
gamma_anneal: false
net: "512,256,128"
action_rate_coef: 0.05
action_mag_coef: 0.005

# --- PPO recipe (= runs/g1_recover_push_fast_privcrit, also from scratch) ------
lr: 1.0e-4
adaptive_lr: false
target_kl: 0.01
ent_coef: 1.0e-3
max_std: 0.4
critic_warmup_steps: 0

checkpoint_every: 50000000
video_interval: 100000000
video_seconds: 20
video_fps: 50
video_wandb: false
