# E3/S0: walker bank only (the push_rear mixture), no LAFAN frames
# generated by examples/make_sweep.py from configs/sweeps/lafan_recovery.yaml -- edit the sweep file, not this one.
family: on_policy
task: g1_recover_lafan
num_envs: 1024
steps: 2000000
load: runs/g1_recover_push_fast_privcrit/g1_recover_push_fast/final_model.zip
critic_warmup_steps: 0
gamma: 0.99
gamma_anneal: false
privileged_critic: true
lr: 0.0001
adaptive_lr: false
target_kl: 0.01
ent_coef: 0.001
max_std: 0.4
net: 512,256,128
action_rate_coef: 0.05
action_mag_coef: 0.005
force_max: 300.0
force_start: 300.0
force_ramp_frac: 0.5
force_init: 0.5
force_floor: 0.2
video_interval: 100000000
video_seconds: 20
video_fps: 50
video_wandb: false
env_overrides:
  dataset: data/g1_recover_states.pt
  weights: {nominal: 0.1, clean: 0.2, pushed: 0.25, fell: 0.3, synthetic: 0.15, mocap: 0.0, handover: 0.0}
  levels: 5
  band_width: 0.4
  init_level: 2
  episode_length_s: 3.0
  rest_terminate: true
  rest_dwell_s: 0.4
  rest_arm_s: 0.8
  rest_gate_on_push: true
  sampler: weighted
  uniform_mix: 0.15
  weight_column: p_surv
checkpoint_every: 100000000
