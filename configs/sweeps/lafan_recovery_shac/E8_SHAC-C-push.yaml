# E8/SHAC-C-push: SHAC-C with the walker starts pushed before the episode (warm start under the push)
# generated by examples/make_sweep.py from configs/sweeps/lafan_recovery_shac.yaml -- edit the sweep file, not this one.
family: model_based
task: g1_recover
num_envs: 4096
steps: 1500000000
load: runs/g1_recover_push_fast_privcrit/g1_recover_push_fast/final_model.zip
wm_warmup_iters: 3000
actor_delay_iters: 500
norm_freeze_steps: 5000000
privileged_critic: true
gamma: 0.99
gamma_anneal: false
gae_lambda: 0.95
softmin_tau: 0.0
action_rate_coef: 0.05
action_mag_coef: 0.005
net: 512,256,128
wm_net: 1024,1024,1024
wm_head_net: 256,256
lr: 0.0002
lr_decay_iters: 146500
lr_min_frac: 0.03
horizon: 32
imagine_batch: 4096
action_noise_std: 0.1
wm_window: 8
wm_batch: 2048
wm_gradient_steps: 10
critic_epochs: 5
critic_minibatches: 4
utd_ratio: 0.4
learning_starts: 64
replay_size: 500
tf32: true
log_interval: 50
checkpoint_every: 100000000
video_interval: 100000000
video_seconds: 20
video_fps: 50
video_wandb: false
env_overrides:
  dataset: [data/g1_handover_postpush_train.pt, data/g1_walker_postpush_train.pt]
  weights: {nominal: 0.0, clean: 0.0, pushed: 0.0, fell: 0.0, synthetic: 0.0, mocap: 0.0, handover: 1.0}
  levels: 5
  band_width: 0.4
  init_level: 2
  episode_length_s: 3.0
  rest_terminate: true
  rest_dwell_s: 0.4
  rest_arm_s: 0.8
  rest_gate_on_push: true
  sampler: uniform
