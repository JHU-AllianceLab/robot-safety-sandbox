# STUDENT world models of the no-height SHAC policies (runs/shac_noheight/shac_s*):
# the teacher's actor and actor-obs normalizer, frozen, collect data on the
# teacher's own training task and start bank, and a FRESH world model is fitted
# to it with the teacher's world-model recipe -- nothing else trains:
#
#   python examples/train.py --config configs/g1_recover_sonic_noheight_student_wm.yaml \
#       --seed 0 --load runs/shac_noheight/shac_s0/g1_recover_noheight_safetyshac1p/final_model.zip \
#       --no-load-world-model --out runs/shac_student/nofoot_s0
#   (the whole experiment: configs/sweeps/shac_student/jobs.txt)
#
#   * task g1_recover_noheight_nofoot: the critic group, i.e. the world-model
#     state, is the actor terms + base_lin_vel (101-D) -- no foot height, air
#     time, contact flags or contact forces. Margin, terminations, spawn and
#     sim context are g1_recover_noheight's. The CONTROL student passes
#     --task g1_recover_noheight (the teacher's 113-D state, same recipe), so
#     student vs control isolates the dropped observations from the recipe;
#   * --load: the teacher's actor + its obs normalizer (the 113-D critic and the
#     teacher's world model do not load: shapes, or --no-load-world-model);
#   * wm_warmup_iters past the end of the run: SHAC never imagines, so the
#     actor and critic never move; norm_freeze_steps past the end: the actor's
#     obs normalizer stays the teacher's, so the saved final_model.zip +
#     tensornormalize.pt act exactly like the teacher (checked by
#     configs/sweeps/shac_student/check_frozen.py);
#   * 300M env steps (~29k iterations x 10 world-model steps, LR cosine over
#     them), vs the teacher's 1.5B; world-model-only runs at ~44k fps.
#
family: model_based      # SHAC family -- the train.py router reads this
task: g1_recover_noheight_nofoot
num_envs: 4096
steps: 300000000
seed: 0

# --- SHARED with the PPO arm (verbatim) ----------------------------------------
env_overrides:
  dataset: data/g1_sonic_push_gfall_arch_train_bank_net.pt
  weights: {handover: 1.0, nominal: 0.0, clean: 0.0, pushed: 0.0, fell: 0.0,
            synthetic: 0.0, mocap: 0.0}
  sampler: uniform       # handover rows drawn uniformly; no level curriculum
  episode_length_s: 3.0
  rest_terminate: true
  rest_dwell_s: 0.4
  rest_arm_s: 0.8

privileged_critic: true  # the world-model state AND the critic's input
gamma: 0.99
gamma_anneal: false
net: "512,256,128"
action_rate_coef: 0.05   # value units here (see the PPO arm's header)
action_mag_coef: 0.005

# --- SHAC recipe (SuperMimic's values unless noted) ---------------------------
lr: 2.0e-4
lr_decay_iters: 29297    # = the run's iterations: 300M / (4096 x 2.5)
lr_min_frac: 0.03
wm_warmup_iters: 1000000000   # past the end: the run only ever fits the world model
actor_delay_iters: 0
horizon: 32
imagine_batch: 4096
action_noise_std: 0.1
softmin_tau: 0.0
wm_net: "1024,1024,1024" # paper 3x2048; 16 GB shared with mjlab
wm_head_net: "256,256"
wm_window: 8
wm_batch: 2048
wm_gradient_steps: 10
critic_epochs: 5
critic_minibatches: 4
utd_ratio: 0.4
learning_starts: 64
replay_size: 500         # paper 1000 per env; ~1.1 GiB at 4096 envs
tf32: true               # the paper's precision; 1.18x faster here

norm_freeze_steps: 1000000000000000   # never: the actor keeps the teacher's obs stats

log_interval: 50
checkpoint_every: 100000000
video_interval: 1000000000000
video_seconds: 20
video_fps: 50
video_wandb: false
