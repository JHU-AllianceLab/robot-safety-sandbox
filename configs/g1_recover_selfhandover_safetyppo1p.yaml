# SafetyPPO1P vs SafetySHAC1P, apples to apples -- the PPO arm.
# M=Safety (avoid-only), A=PPO, P=1P. Twin of g1_recover_selfhandover_safetyshac1p.yaml.
#
#   python examples/train.py --config configs/g1_recover_selfhandover_safetyppo1p.yaml \
#       --seed 0 --out runs/shac_vs_ppo/ppo_s0
#   (the whole experiment: examples/run_jobs.sh configs/sweeps/shac_vs_ppo/jobs.txt)
#
# THE QUESTION: from the same perturbed initial conditions, which learner finds
# the better fallback in 250M env steps (equal SAMPLES -- SuperMimic's claim is
# sample efficiency; PPO is ~2.6x faster per env step here, so in equal
# WALL-CLOCK it would get ~650M)? Both arms learn FROM SCRATCH, on the
# plain g1_recover task (no in-episode push), every episode starting from a row
# of data/g1_self_handover_train.pt: the privileged-critic push policy's
# (runs/g1_recover_push_fast_privcrit) own states 0-20 control steps after a
# 60-300 N, 0.2 s push, on LAFAN train frames (harvest_g1_frontier_states.py
# --kind handover: the push has ENDED, nothing pending). The push policy itself
# survives ~43 % of these rows.
#
# SHARED with the SHAC arm, verbatim: task, env_overrides (spawn = that bank
# only, uniform over its rows, no curriculum; the push_fast episode: 3 s cap and
# the rest truncation), num_envs, steps, the privileged critic (114 dims; actor
# 98), the 512-256-128 actor and critic, gamma 0.99 (fixed), and the action
# penalty weights. NOT shared, by construction: the learner's own optimizer
# recipe (this one is runs/g1_recover_push_fast_privcrit's PPO recipe), and the
# UNITS of the action penalties -- PPO adds them to an advantage-normalized
# loss, SHAC to an imagined margin -- so compare the policies' action
# statistics in the eval (label_start_states.py report: action_rate,
# action_mag) rather than assume equal smoothness.
family: on_policy        # PPO family -- the train.py router reads this
task: g1_recover
num_envs: 4096
steps: 250000000
seed: 0

env_overrides:
  dataset: data/g1_self_handover_train.pt
  weights: {handover: 1.0, nominal: 0.0, clean: 0.0, pushed: 0.0, fell: 0.0,
            synthetic: 0.0, mocap: 0.0}
  sampler: uniform       # handover rows drawn uniformly; no level curriculum
  episode_length_s: 3.0
  rest_terminate: true
  rest_dwell_s: 0.4
  rest_arm_s: 0.8

privileged_critic: true
gamma: 0.99
gamma_anneal: false
net: "512,256,128"
action_rate_coef: 0.05
action_mag_coef: 0.005

# --- PPO recipe (= runs/g1_recover_push_fast_privcrit, also from scratch) ------
lr: 1.0e-4
adaptive_lr: false
target_kl: 0.01
ent_coef: 1.0e-3
max_std: 0.4
critic_warmup_steps: 0

checkpoint_every: 25000000
video_interval: 100000000
video_seconds: 20
video_fps: 50
video_wandb: false
