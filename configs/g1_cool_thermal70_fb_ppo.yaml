# COOLING POLICY, round 3 (the user, 2026-11-19): g1_cool_thermal70_fb -- take over from the
# thermal70 SHAC FALLBACK (spawns on its states 0.5-15 s after a minor SONIC handover,
# data/g1_cool_fallback_bank.pt from examples/harvest_cool_fallback_states.py), every motor's
# heat weighted by its own temperature (free below 50 C, ramping to 65 C; mdp.cool_ramp),
# 1-4 random extra hot motors, handover-jump cost -0.1 over 0.5 s, pushes 0.19-0.97 m/s.
# Trained fresh, the pilot's PPO settings.
#
#   python examples/train.py --config configs/g1_cool_thermal70_fb_ppo.yaml --seed 0 \
#       --out runs/g1_cool/fb_s0
family: on_policy
task: g1_cool_thermal70_fb
num_envs: 4096
steps: 500000000
seed: 0
lr: 3.0e-4
ent_coef: 5.0e-3
n_steps: 24
gamma: 0.99
net: "512,256,128"
video_interval: 0        # no render env (EGL is not available on every GPU node)
