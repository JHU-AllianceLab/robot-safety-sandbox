# SafetyPPO fallback, temperature-AGNOSTIC, for the v0.6.1 filter study (the user, 2026-11-23:
# "the baselines stay agnostic about temperature"): the recipe of configs/g1_recover_sonic_safetyppo1p.yaml
# (GAE avoid value) on task g1_recover_noheight_v6 (sysID v0.6 body = v0.6.1's body files; actor 98-D,
# critic 113-D, margin g_fall_noheight, no heat model) and the v6 SONIC handover bank. Identical to
# configs/g1_recover_noheight_v6_lambdareach1p.yaml minus the lambda-Reach value target.
#
#   PYTHONPATH=$HOME/safety-stable-baselines-baselines python examples/train.py \
#       --config configs/g1_recover_noheight_v6_safetyppo1p.yaml --seed 0 --out runs/v061_study/safetyppo_noheight_s0
#
family: on_policy
task: g1_recover_noheight_v6
num_envs: 4096
steps: 1500000000
seed: 0

env_overrides:
  dataset: data/g1_sonic_push_gfall_sysid316v6_train_bank_net.pt
  weights: {handover: 1.0, nominal: 0.0, clean: 0.0, pushed: 0.0, fell: 0.0,
            synthetic: 0.0, mocap: 0.0}
  sampler: uniform
  episode_length_s: 3.0
  rest_terminate: true
  rest_dwell_s: 0.4
  rest_arm_s: 0.8

privileged_critic: true
gamma: 0.99
gamma_anneal: false
net: "512,256,128"
action_rate_coef: 0.05
action_mag_coef: 0.005


lr: 1.0e-4
adaptive_lr: false
target_kl: 0.01
ent_coef: 1.0e-3
max_std: 0.4
critic_warmup_steps: 0

checkpoint_every: 50000000
video_interval: 0              # no training clips: the EGL renderer aborted on an H100 node (job 2042821)
video_seconds: 20
video_fps: 50
video_wandb: false
