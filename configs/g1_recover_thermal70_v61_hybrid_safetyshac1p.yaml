# Beat-It THERMAL (safety SHAC + hybrid world model: NN body + the analytic heat model), retrained on
# sysID v0.6.1 for the v0.6.1 filter study (the user, 2026-11-23): configs/g1_recover_sonic_thermal70_v6_
# hybrid_safetyshac1p.yaml verbatim but the task, g1_recover_thermal70_v61 (v0.6.1 = the waist linkage
# sign fix in the heat model; body unchanged). Margin min(fall, (70 - hottest winding) / 10), 70 C
# overheat termination, start levels U(30, 70), actor 127-D, world-model state 200-D.
#
#   PYTHONPATH=$HOME/ssb-wt-hybrid python examples/train.py \
#       --config configs/g1_recover_thermal70_v61_hybrid_safetyshac1p.yaml --seed 0 --out runs/v061_study/beatit_thermal_s0
#
family: model_based      # SHAC family -- the train.py router reads this
task: g1_recover_thermal70_v61
num_envs: 4096
steps: 1500000000
seed: 0
wm_hybrid: true   # the analytic heat block (see header)

env_overrides:
  dataset: data/g1_sonic_push_gfall_sysid316v6_train_bank_net.pt
  weights: {handover: 1.0, nominal: 0.0, clean: 0.0, pushed: 0.0, fell: 0.0,
            synthetic: 0.0, mocap: 0.0}
  sampler: uniform       # handover rows drawn uniformly; no level curriculum
  episode_length_s: 3.0
  rest_terminate: true
  rest_dwell_s: 0.4
  rest_arm_s: 0.8

privileged_critic: true  # the world-model state AND the critic's input
gamma: 0.99
gamma_anneal: false
net: "512,256,128"
action_rate_coef: 0.05   # value units here (see the PPO arm's header)
action_mag_coef: 0.005

lr: 2.0e-4
lr_decay_iters: 146500   # = the run's iterations: 1.5B / (4096 x 2.5)
lr_min_frac: 0.03
wm_warmup_iters: 1000    # ~10M env steps of model-only fitting first (the model
                         # reached its plateau error by ~350 iterations on G1)
actor_delay_iters: 200   # ~2M more: the critic's first fit before the actor moves
horizon: 32
imagine_batch: 4096
action_noise_std: 0.1
softmin_tau: 0.0
wm_net: "1024,1024,1024" # paper 3x2048; 16 GB shared with mjlab
wm_head_net: "256,256"
wm_window: 8
wm_batch: 2048
wm_gradient_steps: 10
critic_epochs: 5
critic_minibatches: 4
utd_ratio: 0.4
learning_starts: 64
replay_size: 500         # paper 1000 per env; ~1.1 GiB at 4096 envs (113-D); ~1.6 GiB at 171-D
tf32: true               # the paper's precision; 1.18x faster here

log_interval: 50
checkpoint_every: 50000000
video_interval: 0              # no training clips: the EGL renderer aborted on an H100 node (job 2042821)
video_seconds: 20
video_fps: 50
video_wandb: false
