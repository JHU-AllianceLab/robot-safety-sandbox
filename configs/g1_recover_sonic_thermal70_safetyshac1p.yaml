# MOTOR TEMPERATURES AT 70 C, LEARNED THROUGH THE MARGIN: the comparison arm of the
# temperature-barrier SHAC (configs/g1_recover_sonic_thermal_cbf_safetyshac1p.yaml; the
# user's request, 2026-11-11; docs/experiments/shac-thermal.md). Both arms hold every
# motor winding below 70 C: there a barrier below the policy clips the torques; here the
# policy must learn it, the limit being in its margin and ending the episode.
#
#   python examples/train.py --config configs/g1_recover_sonic_thermal70_safetyshac1p.yaml \
#       --seed 0 --out runs/shac_thermal70/shac_s0
#   (the whole experiment: configs/sweeps/shac_thermal70/jobs.txt)
#
# Needs the mjlab316 env (MuJoCo / Warp 3.16, mjlab main dcdf6ce5) and the sysID repo at
# $G1_SYSID_DIR (pinned to v0.4.0 in envs/assets/g1_sysid.py).
#
# configs/g1_recover_sonic_thermal_safetyshac1p.yaml (the 85 C design) but for the task,
# g1_recover_thermal70 (envs/g1_recover/thermal.py), which moves the limit to 70 C:
#   * margin min(tilt, non-foot contact, (70 C - hottest winding) / 10 C); a winding at
#     70 C ends the episode as a failure; no barrier;
#   * start temperatures per reset as the barrier arm: level T0 ~ U(30, 70) C per robot,
#     each winding ~ U(30, T0), housing = winding - U(0, 20) C (>= 30), structure =
#     housing;
# and the same as both: the identified G1 (dcmotor actuators at 52 V), the heat model
# (g1_sysid.MotorThermal v0.4, sim_heat_scale on) every physics substep, actor obs + 29
# winding temperatures (127-D), critic group / world-model state + winding and housing
# temperatures (171-D), the start bank of configs/sweeps/shac_thermal/data_jobs.txt, and
# the no-height recipe below, verbatim.
#
family: model_based      # SHAC family -- the train.py router reads this
task: g1_recover_thermal70
num_envs: 4096
steps: 1500000000
seed: 0

# --- SHARED with the PPO arm (verbatim) ----------------------------------------
env_overrides:
  dataset: data/g1_sonic_push_gfall_sysid316_train_bank_net.pt
  weights: {handover: 1.0, nominal: 0.0, clean: 0.0, pushed: 0.0, fell: 0.0,
            synthetic: 0.0, mocap: 0.0}
  sampler: uniform       # handover rows drawn uniformly; no level curriculum
  episode_length_s: 3.0
  rest_terminate: true
  rest_dwell_s: 0.4
  rest_arm_s: 0.8

privileged_critic: true  # the world-model state AND the critic's input
gamma: 0.99
gamma_anneal: false
net: "512,256,128"
action_rate_coef: 0.05   # value units here (see the PPO arm's header)
action_mag_coef: 0.005

# --- SHAC recipe (SuperMimic's values unless noted) ---------------------------
lr: 2.0e-4
lr_decay_iters: 146500   # = the run's iterations: 1.5B / (4096 x 2.5)
lr_min_frac: 0.03
wm_warmup_iters: 1000    # ~10M env steps of model-only fitting first (the model
                         # reached its plateau error by ~350 iterations on G1)
actor_delay_iters: 200   # ~2M more: the critic's first fit before the actor moves
horizon: 32
imagine_batch: 4096
action_noise_std: 0.1
softmin_tau: 0.0
wm_net: "1024,1024,1024" # paper 3x2048; 16 GB shared with mjlab
wm_head_net: "256,256"
wm_window: 8
wm_batch: 2048
wm_gradient_steps: 10
critic_epochs: 5
critic_minibatches: 4
utd_ratio: 0.4
learning_starts: 64
replay_size: 500         # paper 1000 per env; ~1.1 GiB at 4096 envs (113-D); ~1.6 GiB at 171-D
tf32: true               # the paper's precision; 1.18x faster here

log_interval: 50
checkpoint_every: 50000000
video_interval: 100000000
video_seconds: 20
video_fps: 50
video_wandb: false
