# The SHAC arm of the SONIC push benchmark rebuilt in mjlab (task g1_recover_bench,
# envs/g1_recover/push_bench.py): the world of the friend's S7 benchmark --
# K as margin (joint term over 0.2 rad) and termination, 2 ms x 10 physics,
# SONIC's hip-pitch motor, foot friction 1, no domain randomization, the 70-D
# exact actor observation (his connector's phi68 + foot contacts).
#
#   python examples/train.py --config configs/g1_recover_bench_safetyshac1p.yaml \
#       --seed 0 --out runs/push_bench/shac_s0
#   (the whole experiment: configs/sweeps/push_bench/README.md)
#
# Identical to configs/g1_recover_sonic_safetyshac1p.yaml (the recipe below is
# copied verbatim) but for the task and the start bank:
#   * data/g1_bench_push_train_bank_net.pt: SONIC tracking his three training
#     motions (walk1_subject1, run1_subject2, dance1_subject1 to 105 s) in this
#     world, his state pool's force push (12 bodies, a surface point, 5-15
#     ticks, dv 0.5-2.5 m/s), rows 0 / 0.1 / 0.2 / 0.3 s after the push ENDS
#     (no push inside an episode: SHAC's world model stays push-agnostic),
#     thinned to its eta = 0.1 net (configs/sweeps/push_bench/data_jobs.txt).
#
family: model_based      # SHAC family -- the train.py router reads this
task: g1_recover_bench
num_envs: 4096
steps: 1500000000
seed: 0

# --- SHARED with the PPO arm (verbatim) ----------------------------------------
env_overrides:
  dataset: data/g1_bench_push_train_bank_net.pt
  weights: {handover: 1.0, nominal: 0.0, clean: 0.0, pushed: 0.0, fell: 0.0,
            synthetic: 0.0, mocap: 0.0}
  sampler: uniform       # handover rows drawn uniformly; no level curriculum
  episode_length_s: 3.0
  rest_terminate: true
  rest_dwell_s: 0.4
  rest_arm_s: 0.8

privileged_critic: true  # the world-model state AND the critic's input
gamma: 0.99
gamma_anneal: false
net: "512,256,128"
action_rate_coef: 0.05   # value units here (see the PPO arm's header)
action_mag_coef: 0.005

# --- SHAC recipe (SuperMimic's values unless noted) ---------------------------
lr: 2.0e-4
lr_decay_iters: 146500   # = the run's iterations: 1.5B / (4096 x 2.5)
lr_min_frac: 0.03
wm_warmup_iters: 1000    # ~10M env steps of model-only fitting first (the model
                         # reached its plateau error by ~350 iterations on G1)
actor_delay_iters: 200   # ~2M more: the critic's first fit before the actor moves
horizon: 32
imagine_batch: 4096
action_noise_std: 0.1
softmin_tau: 0.0
wm_net: "1024,1024,1024" # paper 3x2048; 16 GB shared with mjlab
wm_head_net: "256,256"
wm_window: 8
wm_batch: 2048
wm_gradient_steps: 10
critic_epochs: 5
critic_minibatches: 4
utd_ratio: 0.4
learning_starts: 64
replay_size: 500         # paper 1000 per env; ~1.1 GiB at 4096 envs
tf32: true               # the paper's precision; 1.18x faster here

log_interval: 50
checkpoint_every: 50000000
video_interval: 100000000
video_seconds: 20
video_fps: 50
video_wandb: false
